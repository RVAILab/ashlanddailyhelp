# Deploys the site to Cloudflare (wrangler.jsonc) on every push to main. Pull requests run the checks but never deploy.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: for f in *.js; do node --check "$f"; done
      - run: npx --yes wrangler@4.152.0 deploy --dry-run
      - if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.152.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
