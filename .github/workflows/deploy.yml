# The app deploys only when the DATABASE_URL repository secret is set; see the README's production setup.
name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: for f in legacy/*.js; do node --check "$f"; done
      - run: npx wrangler deploy --dry-run -c legacy/wrangler.jsonc

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: echo "DATABASE_URL=$DATABASE_URL" > .dev.vars
      - run: npm run db:migrate
      - run: npm run e2e

  deploy-legacy:
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy -c legacy/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    needs: [check, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - if: env.HAS_DATABASE != 'true'
        run: echo "::notice::The DATABASE_URL repository secret is not set, so the app is not deployed."
      - if: env.HAS_DATABASE == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_DATABASE == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_DATABASE == 'true'
        run: npm ci
      - if: env.HAS_DATABASE == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: env.HAS_DATABASE == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: env.HAS_DATABASE == 'true'
        name: The deployed app reaches its database
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://ashlanddailyhelp-app.kitchenlab.workers.dev/health
