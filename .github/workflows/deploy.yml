# The app deploys only when the DATABASE_URL repository secret is set; see the README's production setup.
# The Playwright journeys (npm run e2e) run locally for now, not here.
name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: for f in legacy/*.js; do node --check "$f"; done
      - run: npx wrangler deploy --dry-run -c legacy/wrangler.jsonc

  deploy-legacy:
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy -c legacy/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - if: env.HAS_DATABASE != 'true'
        run: echo "::notice::The DATABASE_URL repository secret is not set, so the app is not deployed."
      - if: env.HAS_DATABASE == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_DATABASE == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_DATABASE == 'true'
        run: npm ci
      - if: env.HAS_DATABASE == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: env.HAS_DATABASE == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: env.HAS_DATABASE == 'true'
        name: The deployed app reaches its database
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://ashlanddailyhelp-app.kitchenlab.workers.dev/health
